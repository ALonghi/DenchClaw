services:
  denchclaw:
    build:
      context: .
      dockerfile: Dockerfile
    image: denchclaw:local
    environment:
      HOME: /home/node
      DENCHCLAW_DAEMONLESS: "1"
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-ws://openclaw-gateway:18789}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_GATEWAY_PASSWORD:-}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      PORT: ${DENCHCLAW_WEB_PORT:-3100}
    volumes:
      - denchclaw_state:/home/node/.openclaw-dench
    ports:
      - "${DENCHCLAW_WEB_PORT:-3100}:3100"
    init: true
    restart: unless-stopped
    networks:
      - openclaw

volumes:
  denchclaw_state:

networks:
  openclaw:
    external: true
    name: ${OPENCLAW_DOCKER_NETWORK:-openclaw_default}
